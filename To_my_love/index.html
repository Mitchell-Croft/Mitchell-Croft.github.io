<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="index.css" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
        <title>To My Love</title>
        <audio id="bg-music" loopPreload="auto" loop>
            <source src="Love_Life.mp3" type="audio/mpeg">
        </audio>
    </head>
    <body>
        <div class="envelope-wrapper">
            <div id="envelope" class="close">
                <div class="front flap"></div>
                <div class="front pocket"></div>
                <div class="letter">
                    <p class="words line1">Dear Jezz, my love for you is an infinite loop that will never reach a break statement.</p>
                    <p class="words line4">5201314</p>
                </div>
                <div class="hearts">
                    <div class="heart a1"></div>
                    <div class="heart a2"></div>
                    <div class="heart a3"></div>
                </div>
            </div>
        </div>
        <div class="reset">
            <button id="open">Open</button>
            <button id="reset">Close</button>

            <img src="bunny.jpg" alt="Photo 1" class="scattered-img top-left">
            <img src="liveware.jpg" alt="Photo 2" class="scattered-img top-right">
            <img src="killware.png" alt="Photo 3" class="scattered-img bottom-left">
            <img src="sleepybunny.jpg" alt="Photo 4" class="scattered-img bottom-right">
        </div>
        <h1 class="valentine">Happy Month Anniversary!!!</h1>
        <script src="index.js"></script>
    </body>
</html>
